# imap-mcp-rs configuration
# Each [[accounts]] entry defines one email account.
#
# This file holds passwords and OAuth2 client secrets — keep it at `chmod 600`.
# The server warns at startup if it is readable by other users.

# Filesystem directories from which attachment files may be read when composing
# drafts. Default is `$XDG_RUNTIME_DIR/imap-mcp-rs` (systemd Linux) with
# fallbacks to `$XDG_CACHE_HOME/imap-mcp-rs` and `/tmp/imap-mcp-rs-$USER`.
# Paths outside these dirs are rejected — this prevents a prompt-injected LLM
# from attaching arbitrary local files like SSH keys. Symlinks are resolved,
# so links that escape the whitelist are also rejected.
# The FIRST entry is where `download_attachment` saves, one UUID subdirectory
# per download. It has to be a directory of your own. The server sets it to
# mode 0700 and refuses a symlink or a directory owned by someone else. At
# startup it removes download subdirectories older than seven days and leaves
# everything else alone. Further entries are only read from.
# Empty list `[]` is rejected — omit the field to get the default. Write
# absolute paths. `~` is not expanded (an entry starting with it is refused),
# and a relative path depends on the directory the MCP client starts the
# server in.
# allowed_attachment_dirs = ["/custom/path", "/home/user/Documents"]

# The tools a client is offered follow from the accounts below: a tool that
# no account may use (read_only, allow_move, allow_delete,
# allow_flag_change) is not offered at all.

# A key the server does not know in an account block stops it at startup with
# the key named: a misspelled `read_only` would otherwise leave the account
# writable.

[[accounts]]
name = "Personal"
host = "imap.gmail.com"
port = 993
username = "user@gmail.com"
# email = "user@gmail.com"          # From address for drafts (defaults to username)
# display_name = "John Doe"         # Name shown in From header (e.g. "John Doe <user@gmail.com>")
# locale = "en"                      # "en" or "de" — controls draft labels, date format, font, prefixes
# signature_html = '<div style="color:#888;margin-top:12px;">Best regards,<br>John Doe</div>'
# signature_text = "Best regards,\nJohn Doe"  # text/plain signature (default: derived from signature_html)
# message_id_domain = "example.com"  # Message-ID domain (default: domain of the sender address)
# read_only = false                  # true = only read tools, no write/draft
# allow_delete = true                # false = delete_email blocked
# allow_move = true                  # false = move_email blocked
# allow_flag_change = true           # false = mark_as_read/unread + flag/unflag blocked
#                                    # (the unread state is often a human's work queue —
#                                    # a bulk mark_as_read erases it with no undo)
# allow_unsafe_expunge = false       # true = permit plain EXPUNGE fallback on servers without UIDPLUS
#                                    # (on such servers, it would sweep \Deleted messages flagged by
#                                    # concurrent clients — phone, webmail. Default false refuses.)
# accept_invalid_certs = false       # true for self-signed certs (testing only!)
# allowed_folders = ["INBOX"]        # restrict accessible folders (optional; empty list `[]` rejected)
auth_method = "password"
password = "your-app-specific-password"

# [[accounts]]
# name = "Work"
# host = "outlook.office365.com"
# port = 993
# username = "user@company.com"
# email = "user@company.com"
# display_name = "John Doe"
# locale = "en"
# read_only = true
# auth_method = "oauth2"
#
# [accounts.oauth2]
# provider = "outlook365"
# tenant = "your-tenant-id"
# client_id = ""
# client_secret = ""              # omit for public clients (see README)
# No refresh_token here: tokens are state, not configuration. Run
# `imap-mcp-rs reauth <account>` once — it performs the browser login and
# stores the token in $XDG_STATE_HOME/imap-mcp-rs/tokens.toml (0600), where
# the server also keeps it current as the provider rotates it.
# A `refresh_token = "..."` line is still read, but only to bootstrap an
# account that has no stored token yet (e.g. configs predating `reauth`).
